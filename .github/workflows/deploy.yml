
name: Deploy App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: hashicorp/setup-terraform@v2

      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - run: cd terraform && terraform init
      - run: cd terraform && terraform apply -auto-approve

      - run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > key.pem
          chmod 400 key.pem

      - run: sudo apt update && sudo apt install ansible -y

      - run: |
          BACKEND_IP=$(cd terraform && terraform output -raw backend_ip)
          DB_ENDPOINT=$(cd terraform && terraform output -raw db_endpoint)

          echo "[backend]" > inventory.ini
          echo "$BACKEND_IP ansible_user=ec2-user ansible_ssh_private_key_file=key.pem" >> inventory.ini

          ansible-playbook -i inventory.ini ansible/deploy.yml --extra-vars "db_host=$DB_ENDPOINT"
